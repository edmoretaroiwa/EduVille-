<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduVille - Online Learning for ZIMSEC, BEC & Cambridge</title>
<meta name="description" content="Free video lessons, past papers, and notes for Mathematics, Physics, Chemistry, and Coding. ZIMSEC, BEC, IGCSE, and A-Level. Commit to Your Future.">
<meta name="keywords" content="ZIMSEC, BEC, Cambridge, IGCSE, A-Level, O-Level, past papers, Zimbabwe, Botswana, online learning">
<link rel="stylesheet" href="style.css">

<!-- Open Graph (WhatsApp/Facebook previews) -->
<meta property="og:title" content="EduVille — Commit to Your Future">
<meta property="og:description" content="Free education platform with videos, notes, and past papers for African students.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://eduvillelearning.africa/">

<!-- Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "EducationalOrganization",
  "name": "EduVille",
  "url": "https://eduvillelearning.africa",
  "description": "Free online learning platform for ZIMSEC, BEC and Cambridge students.",
  "foundingDate": "2025",
  "founders": [
    {"@type": "Person", "name": "Edmore Taroiwa"},
    {"@type": "Person", "name": "Benjamin Nyamukusa"}
  ],
  "email": "ttaroiwa@gmail.com",
  "telephone": "+267787279982"
}
</script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body class="auth-page">

  <!-- MOTTO BAR -->
  <div class="motto-bar">✨ Commit to Your Future ✨</div>

  <!-- BACK TO HOME -->
  <a href="index.html" class="auth-back">← Back to Home</a>

  <!-- AUTH CARD -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- LOGO -->
      <div class="logo">
  <img src="logo-icon.png" alt="EduVille" class="logo-img">
  <span class="logo-text">Edu<span class="gold">Ville</span></span>
</div>

      <!-- TABS -->
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" onclick="switchTab('login')">Login</button>
        <button id="tab-signup" class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your password" required>

        <button type="submit" class="btn btn-gold auth-submit">🔐 Login</button>
        <p class="auth-hint">New to EduVille? <a onclick="switchTab('signup')">Create an account</a></p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" class="auth-form hidden" onsubmit="handleSignup(event)">
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="e.g. Mary Achieng" required>

        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" id="signup-password" placeholder="At least 6 characters" required minlength="6">

        <label>I am a...</label>
        <div class="role-picker">
          <label class="role-option">
            <input type="radio" name="role" value="student" checked>
            <span>🎓 Student</span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="teacher">
            <span>📚 Teacher</span>
          </label>
        </div>

        <button type="submit" class="btn btn-gold auth-submit">✨ Create Account</button>
        <p class="auth-hint">Already have an account? <a onclick="switchTab('login')">Login here</a></p>
      </form>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="auth-footer">
    <p>© 2025 EduVille · Commit to Your Future</p>
    <p>📧 ttaroiwa@gmail.com · 📞 +267 78 727 9982</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
